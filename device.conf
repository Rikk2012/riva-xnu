# Experimental bring-up status. Only mark a feature "works" after it has been tested on riva.
device riva
	title       Xiaomi Redmi 5A
	vendor      Xiaomi
	soc         msm8917
	defconfig   riva_defconfig
	maintainer  Rikk2012
	status      display     partial   UEFI framebuffer path not yet ported or tested on riva
	status      touch       missing   controller and IRQ not yet confirmed from the device tree
	status      buttons     missing   PMIC/GPIO mapping not yet confirmed
	status      cpu         partial   MSM8917 has four Cortex-A53 cores; HakiOS secondary-core bring-up not tested
	status      gpu         missing   Adreno 308; no riva GPU driver, firmware integration, or Metal support
	status      storage     missing   eMMC; no riva storage driver or read-only path
	status      audio       missing   audio DSP and codec path not ported
	status      battery     missing   PMIC/charger telemetry not ported
	status      haptic      missing   actuator and controller not identified
	status      camera      missing   camera sensors and ISP path not ported
	status      torch       missing   LED controller not identified
	status      wifi        missing   WLAN chipset and firmware path not confirmed
	status      bluetooth   missing   Bluetooth controller path not confirmed
	status      cellular    missing   modem/IPA memory map and firmware path not ported
	status      thermal     missing   thermal sensors and trip points not mapped
