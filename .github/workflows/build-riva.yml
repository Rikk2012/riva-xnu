name: Build HakiOS for Redmi 5A (riva)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/build-riva.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/build-riva.yml'

permissions:
  contents: read

concurrency:
  group: build-riva-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: XNU kernel (experimental riva config)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      THEOS: ${{ runner.temp }}/theos
    steps:
      - name: Checkout riva device repository
        uses: actions/checkout@v4
        with:
          path: riva-device

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang llvm lld lldb \
            git curl wget python3 python3-venv python3-pip \
            flex bison gawk m4 perl autoconf automake \
            nasm cpio libssl-dev libelf-dev zlib1g-dev \
            libncurses-dev bc rsync device-tree-compiler

      - name: Install Theos and its Linux toolchain
        run: |
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks-git" "$THEOS/sdks"
          curl -fL --retry 3 \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            -o "$RUNNER_TEMP/ios-toolchain.tar.xz"
          tar -xJf "$RUNNER_TEMP/ios-toolchain.tar.xz" -C "$THEOS/toolchain"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$THEOS/sdks-git"
          git -C "$THEOS/sdks-git" sparse-checkout set iPhoneOS16.5.sdk
          ln -sfn "$THEOS/sdks-git/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -x "$THEOS/toolchain/linux/iphone/bin/ld"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include"

      - name: Checkout upstream HakiOS common tree
        run: |
          git clone --depth=1 --recurse-submodules \
            https://github.com/oosexgang/hakios-xnu-kernel.git hakios
          mkdir -p hakios/devices/riva
          cp -a riva-device/. hakios/devices/riva/

      - name: Prepare XNU and dependencies
        working-directory: hakios
        run: |
          ./xnu/apply.sh
          ./xnu-deps/setup.sh

      - name: Generate and validate riva configuration
        working-directory: hakios
        run: |
          make riva_defconfig DEVICE=riva
          tools/hakios-config.py check
          tools/hakios-device.py check riva

      - name: Build XNU kernel
        working-directory: hakios
        env:
          JOBS: 2
        run: |
          source ./xnu-env.sh
          make kernel DEVICE=riva JOBS="$JOBS"

      - name: Upload kernel outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riva-xnu-build
          if-no-files-found: warn
          path: |
            hakios/xnu-src/**/BUILD/obj/**/mach*
            hakios/xnu-src/**/BUILD/obj/**/kernel*
            hakios/logs/**
            hakios/.config

  uefi:
    name: Mu-Silicium UEFI (requires a real riva platform and XBL payload)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout riva device repository
        uses: actions/checkout@v4
        with:
          path: riva-device

      - name: Check required platform and vendor files
        id: payload
        shell: bash
        run: |
          if test -f riva-device/uefi/files/Platforms/Xiaomi/rivaPkg/rivaPkg.dsc \
             && find riva-device/uefi/files/Binaries/riva -type f -print -quit 2>/dev/null | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UEFI skipped: rivaPkg.dsc and device-owned XBL driver payload are not both present."
          fi

      - name: Install UEFI build dependencies
        if: steps.payload.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget python3 python3-venv python3-pip \
            build-essential clang llvm lld nasm mono-complete

      - name: Checkout HakiOS and overlay riva device
        if: steps.payload.outputs.ready == 'true'
        run: |
          git clone --depth=1 --recurse-submodules \
            https://github.com/oosexgang/hakios-xnu-kernel.git hakios
          mkdir -p hakios/devices/riva
          cp -a riva-device/. hakios/devices/riva/

      - name: Apply Mu-Silicium and riva platform
        if: steps.payload.outputs.ready == 'true'
        working-directory: hakios
        run: |
          ./uefi/apply.sh riva
          python3 -m venv venv
          venv/bin/pip install -r Mu-Silicium/pip-requirements.txt

      - name: Build Mu-Silicium UEFI
        if: steps.payload.outputs.ready == 'true'
        working-directory: hakios
        run: |
          source venv/bin/activate
          cd Mu-Silicium
          python3 build_uefi.py -d riva -r RELEASE

      - name: Upload UEFI image
        if: steps.payload.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: riva-silicium-uefi
          if-no-files-found: error
          path: hakios/Mu-Silicium/Build/rivaPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
